# Decision settings. Every feeder writing the same store shares these; a
# feeder can layer its own YAML or overrides on top via load_settings().
# Which store, embedding model and judge to use are objects the caller
# constructs (see topicsleuth.interfaces), not settings.

# What the store follows, as a noun phrase the prompts are rendered with.
domain: the field this store follows

# The prose in the prompts that describes that field. The defaults, in
# RubricConfig (topicsleuth/rubric.py), describe a feed of papers, release
# notes and posts about a technical field; set your own here if yours is
# something else. `topicsleuth show-prompts` prints the result.
# rubric:
#   source_kinds: <the kinds of source that arrive, as a list in prose>
#   evidence_kinds: [<the vocabulary of the item `evidence` field, if your feeder sets one>]
#   reading_by_kind: <one sentence fragment: how each kind of source bears on a question>
#   topic_size: <how much evidence a right-sized topic gathers, e.g. "10-50 observations over a year">
#   question_examples:
#     - question: <a right-sized question in your field>
#       subject: <the subject it would be wrong to track instead>
#   subset_example: <one worked example of the subset_question label>
#   counter_examples:
#     - <a decision the judge gets wrong in your field, and the right answer>

embedding:
  dimensions: 1024          # what the store's vector index was built for

candidates:
  tag_overlap: true
  # Tags excluded from overlap matching. List any tag every item carries
  # (the tag a feeder selects items by, for instance); matching on such a
  # tag turns the channel into "every topic that ever copied it".
  ignored_tags: []
  vector_limit: 30          # nearest topics per item
  vector_num_candidates: 200  # approximate-search breadth, for stores that take it

synthesize:
  # Second independent pass before any propose_new is accepted. See
  # SynthesizeConfig in settings.py.
  confirm_proposals: true
  confirm_candidates: 5
  confirm_backend: judge       # judge | decision
  confirm_link_threshold: 0.7  # decision backend: p(belongs) needed to demote a proposal to a link
  # A link decision may name several topics. The first link always stands;
  # a later one scoring below this floor is dropped. 0 keeps them all.
  secondary_link_floor: 0.0

judge:
  # Output-token cap per call to the judge. A cap costs nothing until a
  # reply reaches it; a reply that does is cut off and the call fails with
  # JudgeTruncated, naming which cap to raise. The first pass classifies
  # every candidate it is shown, so it grows with candidates.vector_limit.
  first_pass_max_tokens: 8192
  confirm_max_tokens: 2048
  merge_max_tokens: 4096
  split_propose_max_tokens: 4096
  split_reassign_max_tokens: 8192

record:
  # Once a topic holds minor_floor_after observations, a new one scoring
  # below minor_floor_strength is filed but marked minor.
  minor_floor_after: 20
  minor_floor_strength: 0.7
  # Item fields copied onto each observation when the item has them, so
  # a topic's mix over time needs no join back to items. The library acts
  # on `tags` and always copies it; name here the fields it should only
  # carry. The copy is a snapshot at record time.
  carry_fields: [evidence, lanes]
