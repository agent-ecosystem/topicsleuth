name: Publish to PyPI

# Trusted publishing: no API token. PyPI is configured with this repository,
# this workflow file name, and the "pypi" environment as a trusted publisher.
#
# A tag publishes only after the suite passes on the tagged commit and the
# built wheel, installed by itself outside the checkout, passes the same
# suite. What ships is what was tested.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[all,test]"
      - run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    # The release artifact, not the source tree: install the wheel in a
    # clean environment, outside the checkout, and run the suite against it.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: src
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "$(ls dist/*.whl)[all,test]"
      - name: Core import, packaged settings, CLI, prompts, typing marker
        run: |
          cd "$RUNNER_TEMP"
          python -c "import topicsleuth, topicsleuth.rubric, topicsleuth.record; from topicsleuth.settings import load_settings; s = load_settings(); assert s.embedding.dimensions == 1024"
          python -c "import importlib.resources as r, topicsleuth; assert (r.files(topicsleuth) / 'py.typed').is_file()"
          topicsleuth --help > /dev/null
          TOPICSLEUTH_STORE=memory topicsleuth show-prompts confirm | head -3
      - name: Test suite against the installed wheel
        run: |
          cp -r src/tests "$RUNNER_TEMP/tests"
          cd "$RUNNER_TEMP"
          python -m pytest -q tests -p no:cacheprovider

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
